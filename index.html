<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Life Tracker" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; background: #FAF6EE; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Recharts depends on prop-types being loaded first as a global -->
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<!-- Google Identity Services, for the "Connect Google Calendar" sign-in -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- pdf.js, used only by the "Scan a RENPHO report" feature on the Weight tab -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin></script>
<script>
  if (window['pdfjs-dist/build/pdf']) {
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
  }
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>

<!-- The tracker app itself -->
<script src="app.bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed", e));
    });
  }
</script>
</body>
</html>
