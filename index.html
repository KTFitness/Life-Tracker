<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Life Tracker" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; background: #FAF6EE; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React 18, kept in this repo (vendor folder) so the app opens with no internet -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<!-- Recharts depends on prop-types being loaded first as a global -->
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/Recharts.js"></script>
<!-- The tracker app itself -->
<script src="app.bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed", e));
    });
  }
</script>
</body>
</html>
